<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar — SpinLav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="hdr"></header>
<div id="flash"></div>
<main id="app"></main>
<footer id="ftr"></footer>
<script type="module">
import { sb, app, layout, flash, exigir, e, money, dataBR, hoje, tempoFmt, horarios, slotsHtml, stepper } from './assets/app.js';
const u = await layout('servicos'); exigir(u);
const id = Number(new URLSearchParams(location.search).get('pedido') || 0);
const { data: p } = await sb.from('pedidos').select('*, servicos(nome)').eq('id', id).eq('cliente_id', u.id).maybeSingle();
const aviso = (m, link = ['solicitar.html', 'Fazer um pedido']) => app.innerHTML = `<div class="wrap page"><div class="card vazio"><p>${m}</p><a class="btn" href="${link[0]}">${link[1]}</a></div></div>`;
if (!p) aviso('Pedido não encontrado.');
else if (p.status !== 'pendente') aviso('Este pedido não está aguardando agendamento.', ['meus-pedidos.html', 'Ver meus pedidos']);
else {
  app.innerHTML = `<div class="wrap page"><div class="head"><div class="eyebrow">Pedido #${p.id}</div><h1>Agendar data e horário</h1></div>
  <div class="form">${stepper(3)}
  <form class="card" id="f">
    <div class="resumo"><span>Serviço: <strong>${e(p.servicos.nome)}</strong></span><span>Peças: <strong>${p.quantidade}</strong></span><span>Tempo estimado: <strong>${tempoFmt(p.tempo_estimado_min)}</strong></span><span>Valor: <strong>${money(p.valor_estimado)}</strong></span></div>
    <p class="alert err" id="err" hidden></p>
    <label for="tipo">Tipo de agendamento</label>
    <select id="tipo"><option value="coleta">Coleta em casa</option><option value="balcao">Levar à lavanderia</option></select>
    <label for="dt">Data</label><input id="dt" type="date" min="${hoje()}" required>
    <label>Horários</label><div id="slots"><p class="note">Escolha uma data para consultar os horários disponíveis.</p></div>
    <button class="btn fit" type="submit" id="b" disabled>Confirmar agendamento</button>
  </form></div></div>`;
  let h = '';
  dt.addEventListener('change', async () => {
    h = ''; b.disabled = true; err.hidden = true;
    if (!dt.value || dt.value < hoje()) { slots.innerHTML = '<p class="note">Escolha uma data a partir de hoje.</p>'; return; }
    slots.innerHTML = '<p class="note">Consultando horários…</p>';
    const r = await horarios(dt.value);
    slots.innerHTML = r.fechado ? '<p class="note">Não atendemos aos domingos. Escolha outra data.</p>'
      : r.erro ? '<p class="alert err">Não foi possível consultar os horários.</p>'
      : r.lista.some(s => s.livre) ? slotsHtml(r.lista) : '<p class="note">Sem horários disponíveis nesta data. Tente outro dia.</p>';
  });
  slots.addEventListener('click', ev => {
    const s = ev.target.closest('.slot'); if (!s || s.disabled) return;
    slots.querySelectorAll('.slot').forEach(x => x.classList.remove('sel')); s.classList.add('sel'); h = s.dataset.h; b.disabled = false;
  });
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); if (!h) return; b.disabled = true; err.hidden = true;
    const { error } = await sb.from('agendamentos').insert({ pedido_id: p.id, cliente_id: u.id, tipo: tipo.value, data_agendada: dt.value, horario: h });
    if (error) { err.textContent = /lotado/i.test(error.message) ? 'Esse horário acabou de ser preenchido. Escolha outro.' : 'Não foi possível agendar: ' + error.message; err.hidden = false; dt.dispatchEvent(new Event('change')); return; }
    flash(`Agendamento confirmado para ${dataBR(dt.value)} às ${h}. Obrigado!`); location.href = 'meus-pedidos.html';
  });
}
</script>
</body>
</html>
