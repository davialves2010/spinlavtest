<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SpinLav, lavanderia profissional. Suas roupas limpas, sua rotina mais leve.">
<title>SpinLav - lavanderia profissional</title>

<script>
  // aplica as preferencias salvas antes de desenhar a pagina (evita piscar o tema)
  try {
    var prefs = JSON.parse(localStorage.getItem('spinlav:prefs') || '{}');
    var raiz = document.documentElement;
    if (prefs.tema === 'claro') raiz.dataset.theme = 'light';
    else if (prefs.tema === 'escuro') raiz.dataset.theme = 'dark';
    if (prefs.contraste) raiz.dataset.contrast = 'alto';
    if (prefs.reduzir) raiz.dataset.motion = 'off';
    if (prefs.texto) raiz.style.setProperty('--cfg-zoom', prefs.texto);
  } catch (e) {}
</script>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c3d73">
<meta name="mobile-web-app-capable" content="yes">
