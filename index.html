<script>try{var p=JSON.parse(localStorage.getItem('spinlav:prefs')||'{}'),r=document.documentElement;if(p.tema==='claro')r.dataset.theme='light';else if(p.tema==='escuro')r.dataset.theme='dark';if(p.contraste)r.dataset.contrast='alto';if(p.reduzir)r.dataset.motion='off';if(p.texto)r.style.setProperty('--cfg-zoom',p.texto)}catch(e){}</script>
