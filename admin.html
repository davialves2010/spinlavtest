<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de pedidos — SpinLav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="hdr"></header>
<div id="flash"></div>
<main id="app"></main>
<footer id="ftr"></footer>
<script type="module">
import { sb, app, layout, flash, exigir, e, money, dataBR, tempoFmt, STATUS } from './assets/app.js';
const u = await layout('admin'); exigir(u, true);
const { data, error } = await sb.from('pedidos').select('*, servicos(nome), clientes(nome,email), agendamentos(data_agendada,horario,tipo)').order('criado_em', { ascending: false });
const lista = data || [];
const ag = p => Array.isArray(p.agendamentos) ? p.agendamentos[0] : p.agendamentos;
const quando = p => { const a = ag(p); return a ? `${dataBR(a.data_agendada)} às ${String(a.horario).slice(0, 5)}<br><small>${a.tipo === 'coleta' ? 'Coleta' : 'Balcão'}</small>` : '—'; };
app.innerHTML = `<div class="wrap page"><div class="head"><div class="eyebrow">Administração</div><h1>Pedidos dos clientes</h1></div><div class="card">
  ${error ? '<p class="alert err">Não foi possível carregar os pedidos.</p>' : ''}
  ${!lista.length ? '<div class="vazio"><p>Nenhum pedido recebido ainda.</p></div>' : `
  <div class="scroll"><table class="tbl"><thead><tr><th>Nº</th><th>Cliente</th><th>Serviço</th><th>Peças</th><th>Tempo</th><th>Agendamento</th><th>Valor</th><th>Obs.</th><th>Status</th></tr></thead><tbody>
  ${lista.map(p => `<tr><td data-label="Pedido">#${p.id}</td><td data-label="Cliente">${e(p.clientes?.nome)}<br><small>${e(p.clientes?.email)}</small></td><td data-label="Serviço">${e(p.servicos?.nome)}</td><td data-label="Peças">${p.quantidade}</td>
    <td data-label="Tempo">${tempoFmt(p.tempo_estimado_min)}</td><td data-label="Agendamento">${quando(p)}</td><td data-label="Valor">${money(p.valor_estimado)}</td><td data-label="Obs.">${e(p.observacoes || '—')}</td>
    <td data-label="Status"><div class="inline"><select id="st-${p.id}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${p.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <button class="btn mini" data-salvar="${p.id}">Salvar</button></div></td></tr>`).join('')}
  </tbody></table></div>`}</div></div>`;
app.addEventListener('click', async ev => {
  const id = ev.target.dataset?.salvar; if (!id) return;
  const { error } = await sb.from('pedidos').update({ status: document.getElementById('st-' + id).value }).eq('id', id);
  flash(error ? 'Não foi possível atualizar o status.' : 'Status atualizado.', error ? 'err' : 'ok'); location.reload();
});
</script>
</body>
</html>
