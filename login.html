<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — SpinLav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="hdr"></header>
<div id="flash"></div>
<main id="app"></main>
<footer id="ftr"></footer>
<script type="module">
import { sb, app, layout, flash, getUser, e } from './assets/app.js';
const u = await layout('login');
if (u) location.href = u.perfil === 'admin' ? 'admin.html' : 'meus-pedidos.html';
app.innerHTML = `<div class="wrap login">
  <form class="card" id="f">
    <div class="eyebrow" style="margin:0">Área do cliente</div>
    <h1>Bem-vindo à SpinLav.</h1>
    <p style="margin:0">Entre para solicitar serviços e acompanhar seus pedidos.</p>
    <p class="alert err" id="err" hidden></p>
    <label for="email">E-mail</label><input id="email" type="email" required autocomplete="email">
    <label for="senha">Senha</label><input id="senha" type="password" required autocomplete="current-password">
    <button class="btn fit" type="submit" id="b">Entrar</button>
    <p class="note">Ainda não tem conta? <a href="cadastro.html"><strong>Cadastre-se</strong></a></p>
  </form>
  <div class="side"><img src="assets/img/logo.jpg" alt="Logo SpinLav"><h2>Uma rotina mais leve começa aqui.</h2><p style="margin:0">Cuidado e praticidade com a identidade acolhedora da SpinLav.</p></div>
</div>`;
f.addEventListener('submit', async ev => {
  ev.preventDefault(); b.disabled = true; err.hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: senha.value });
  if (error) { err.textContent = error.message.includes('Email not confirmed') ? 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).' : 'E-mail ou senha incorretos.'; err.hidden = false; b.disabled = false; return; }
  const me = await getUser(); flash('Olá, ' + me.nome + '! Que bom ter você de volta.');
  location.href = me.perfil === 'admin' ? 'admin.html' : 'meus-pedidos.html';
});
</script>
</body>
</html>
