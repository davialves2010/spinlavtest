<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus pedidos — SpinLav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="hdr"></header>
<div id="flash"></div>
<main id="app"></main>
<footer id="ftr"></footer>
<script type="module">
import { sb, app, layout, flash, exigir, e, money, dataBR, STATUS } from './assets/app.js';
const u = await layout(''); exigir(u);
async function carregar() {
  const { data, error } = await sb.from('pedidos').select('*, servicos(nome)').eq('usuario_id', u.id).order('criado_em', { ascending: false });
  const lista = data || [];
  app.innerHTML = `<div class="wrap page"><div class="head"><div class="eyebrow">Olá, ${e(u.nome)}</div><h1>Meus pedidos</h1></div><div class="card">
  ${error ? '<p class="alert err">Não foi possível carregar seus pedidos.</p>' : ''}
  ${!lista.length ? '<div class="vazio"><p>Você ainda não fez nenhum pedido.</p><a class="btn" href="solicitar.html">Solicitar serviço</a></div>' : `
  <div class="scroll"><table class="tbl"><tr><th>Nº</th><th>Serviço</th><th>Peças</th><th>Coleta</th><th>Valor estimado</th><th>Status</th><th></th></tr>
  ${lista.map(p => `<tr><td>#${p.id}</td><td>${e(p.servicos?.nome)}</td><td>${p.quantidade}</td><td>${dataBR(p.data_coleta)}</td><td>${money(p.valor_estimado)}</td>
    <td><span class="badge s-${p.status}">${STATUS[p.status]}</span></td>
    <td>${p.status === 'pendente' ? `<button class="btn o mini" data-cancelar="${p.id}">Cancelar</button>` : ''}</td></tr>`).join('')}
  </table></div><div><a class="btn" href="solicitar.html">Novo pedido</a></div>`}
  </div></div>`;
}
app.addEventListener('click', async ev => {
  const id = ev.target.dataset?.cancelar; if (!id || !confirm('Cancelar este pedido?')) return;
  const { error } = await sb.from('pedidos').update({ status: 'cancelado' }).eq('id', id).eq('status', 'pendente');
  flash(error ? 'Este pedido não pode mais ser cancelado.' : 'Pedido cancelado.', error ? 'err' : 'ok'); location.reload();
});
await carregar();
</script>
</body>
</html>
